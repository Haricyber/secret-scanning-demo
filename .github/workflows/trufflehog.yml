name: TruffleHog Secret Scanning
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
jobs:
  trufflehog:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ Full git history
 
      - name: Determine Base SHA
        id: get_base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
            BEFORE="${{ github.event.before }}"
            CURRENT="${{ github.sha }}"
 
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ "$BEFORE" = "$CURRENT" ]; then
              echo "BASE_SHA=$(git rev-list --max-parents=0 HEAD)" >> $GITHUB_ENV
            else
              echo "BASE_SHA=$BEFORE" >> $GITHUB_ENV
            fi
 
            echo "HEAD_SHA=$CURRENT" >> $GITHUB_ENV
          fi
 
      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ env.BASE_SHA }}
          head: ${{ env.HEAD_SHA }}
          extra_args: --only-verified   # ✅ --fail removed, Action handles it automatically
