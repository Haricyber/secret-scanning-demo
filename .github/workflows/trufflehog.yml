name: TruffleHog Secret Scanning
 
on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main
 
jobs:

  trufflehog:

    runs-on: ubuntu-latest
 
    steps:

      - name: Checkout code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0   # ✅ Full git history — critical for diff detection
 
      - name: Determine Base SHA

        id: get_base

        run: |

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV

            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

          else

            # For push events — use the previous commit as base

            BEFORE="${{ github.event.before }}"

            CURRENT="${{ github.sha }}"
 
            # Handle first push (before = 000...0) or same commit edge case

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ "$BEFORE" = "$CURRENT" ]; then

              echo "BASE_SHA=$( git rev-list --max-parents=0 HEAD )~1" >> $GITHUB_ENV

            else

              echo "BASE_SHA=$BEFORE" >> $GITHUB_ENV

            fi
 
            echo "HEAD_SHA=$CURRENT" >> $GITHUB_ENV

          fi
 
      - name: Debug SHAs (optional — remove after testing)

        run: |

          echo "Base SHA: $BASE_SHA"

          echo "Head SHA: $HEAD_SHA"
 
      - name: Run TruffleHog Secret Scan

        uses: trufflesecurity/trufflehog@main

        with:

          path: ./

          base: ${{ env.BASE_SHA }}

          head: ${{ env.HEAD_SHA }}

          extra_args: --only-verified --fail
